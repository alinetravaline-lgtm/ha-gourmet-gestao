<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HA Gourmet · Gestão</title>
  <meta name="theme-color" content="#3b2418" />
  <script>if (new URLSearchParams(location.search).get("app") === "vendedor") location.replace("vendedor.html" + location.hash);</script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HA Gourmet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">H&amp;A</div>
        <div>
          <div class="brand-name">HA Gourmet</div>
          <div class="brand-sub">Gestão do negócio</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button id="btnExport">Baixar backup dos dados</button>
        <button id="btnImport">Importar backup</button>
        <button id="btnReset">Restaurar dados da planilha</button>
        <input type="file" id="fileImport" accept="application/json" hidden />
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="menu-btn" id="menuBtn" aria-label="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div>
            <h1 id="pageTitle">Painel</h1>
            <p id="pageSub"></p>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
          <div class="topbar-actions" id="topActions"></div>
          <span class="sync-pill" id="syncPill"></span>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
