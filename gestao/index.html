<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HA La Vie · Gestão</title>
  <meta name="theme-color" content="#233329" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HA La Vie" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css?v=20261028a" />
  <!-- Fica no HTML para a gestão não aparecer atrás do login se o CSS vier de um cache antigo -->
  <style>body.travado .app { display: none; }</style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="travado">
  <div class="acesso" id="acesso">
    <div class="acesso-card">
      <a href="../" class="acesso-marca"><img src="../marca/assinatura-horizontal-clara.svg" alt="HA La Vie Pâtisserie" width="118" height="52" /><small>Área administrativa</small></a>
      <div id="acessoConteudo"><p class="hint">Verificando acesso…</p></div>
    </div>
  </div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand brand-assinatura">
        <img src="../marca/assinatura-horizontal-clara.svg" alt="HA La Vie Pâtisserie" width="109" height="48" />
        <div class="brand-sub">Gestão do negócio</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button type="button" onclick="location.href='../clube/admin/'">Clube e assinaturas</button>
        <button id="btnExport">Baixar backup dos dados</button>
        <button id="btnImport">Importar backup</button>
        <button id="btnReset">Restaurar dados da planilha</button>
        <button type="button" id="btnSair">Sair da conta</button>
        <input type="file" id="fileImport" accept="application/json" hidden />
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="menu-btn" id="menuBtn" aria-label="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div>
            <h1 id="pageTitle">Painel</h1>
            <p id="pageSub"></p>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
          <div class="topbar-actions" id="topActions"></div>
          <span class="sync-pill" id="syncPill"></span>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <script>window.HAG_BASE = "../";</script>
  <script src="../config.js?v=20261028a"></script>
  <script type="module" src="acesso.js?v=20261028a"></script>
</body>
</html>
